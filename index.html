<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adept Dispatch Hub - Supabase Cloud</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans antialiased">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-emerald-600 rounded-xl text-white shadow-lg shadow-emerald-600/20">
                    <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">Adept Dispatch Hub</h1>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span id="sync-dot" class="w-2 h-2 rounded-full bg-amber-500"></span>
                        <p id="sync-text" class="text-xs text-slate-400">Connecting to Cloud Database...</p>
                    </div>
                </div>
            </div>
            
            <a href="driver.html" target="_blank" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs font-semibold transition-all w-fit">
                <i data-lucide="smartphone" class="w-4 h-4 text-emerald-400"></i> Open Driver App
            </a>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Order Creation Form -->
            <div class="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl h-fit">
                <div class="flex items-center gap-2 border-b border-slate-800 pb-3">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-emerald-400"></i>
                    <h2 class="font-bold text-white text-base">New Dispatch Manifest</h2>
                </div>

                <form id="dispatch-form" onsubmit="createNewOrder(event)" class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Order / Load ID</label>
                        <input type="text" id="order-number" required placeholder="e.g. LOAD-8849" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                    </div>

                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Broker / Customer Name</label>
                        <input type="text" id="broker-name" required placeholder="e.g. Ready Logistics" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pickup Location</label>
                            <input type="text" id="pickup-loc" required placeholder="City, ST" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Dropoff Location</label>
                            <input type="text" id="drop-loc" required placeholder="City, ST" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Vehicle Year, Make, Model</label>
                        <input type="text" id="vehicle-ymm" required placeholder="e.g. 2023 Ford F-150" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl text-sm shadow-lg shadow-emerald-600/20 transition-all cursor-pointer flex items-center justify-center gap-2">
                        <i data-lucide="send" class="w-4 h-4"></i> Dispatch to Driver
                    </button>
                </form>
            </div>

            <!-- Active Orders Board -->
            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div class="flex items-center gap-2">
                        <i data-lucide="list-todo" class="w-5 h-5 text-emerald-400"></i>
                        <h2 class="font-bold text-white text-base">Active Cloud Dispatches</h2>
                    </div>
                    <span id="order-count" class="bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/20 font-medium">0 Orders</span>
                </div>

                <div id="dispatch-list" class="space-y-3">
                    <!-- Populated dynamically from Supabase -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // Configure Your Supabase Credentials Here
        // ==========================================
        const SUPABASE_URL = 'https://lofknjtylufqudpgddiq';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvZmtuanR5bHVmcXVkcGdkZGlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MzY2ODEsImV4cCI6MjEwNjExMjY4MX0.-8yeGzzP6mfx89qLWNNjzGPV0gb3mpvnXvnWL5wzkGM';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener("DOMContentLoaded", () => {
            loadDispatchesFromSupabase();
            subscribeToLiveChanges();
        });

        // 1. Fetch Orders and Vehicles from Supabase
        async function loadDispatchesFromSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .select('*, vehicles(*)')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                updateStatus(true, 'Connected to Supabase');
                renderDispatches(data || []);
            } catch (err) {
                console.error("Supabase load error:", err);
                updateStatus(false, 'Database Error');
            }
        }

        // 2. Realtime Listener
        function subscribeToLiveChanges() {
            supabaseClient
                .channel('dispatch-changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => loadDispatchesFromSupabase())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'vehicles' }, () => loadDispatchesFromSupabase())
                .subscribe();
        }

        // 3. Insert New Order and Vehicle into Supabase
        async function createNewOrder(e) {
            e.preventDefault();

            const orderNumber = document.getElementById('order-number').value.trim();
            const brokerName = document.getElementById('broker-name').value.trim();
            const pickup = document.getElementById('pickup-loc').value.trim();
            const drop = document.getElementById('drop-loc').value.trim();
            const vehicleYmm = document.getElementById('vehicle-ymm').value.trim();

            // Insert into 'orders' table
            const { data: orderData, error: orderError } = await supabaseClient
                .from('orders')
                .insert([{
                    order_number: orderNumber,
                    broker_name: brokerName,
                    pickup: pickup,
                    drop: drop,
                    order_status: 'Assigned'
                }])
                .select();

            if (orderError) {
                alert("Error creating order: " + orderError.message);
                return;
            }

            const newOrderId = orderData[0].id;

            // Insert related vehicle into 'vehicles' table
            const { error: vehicleError } = await supabaseClient
                .from('vehicles')
                .insert([{
                    order_id: newOrderId,
                    ymm: vehicleYmm,
                    operable: true,
                    has_damage: false
                }]);

            if (vehicleError) {
                alert("Error adding vehicle: " + vehicleError.message);
                return;
            }

            document.getElementById('dispatch-form').reset();
            loadDispatchesFromSupabase();
        }

        // 4. Delete Order
        async function deleteOrder(orderId) {
            if (!confirm("Are you sure you want to remove this dispatch?")) return;

            const { error } = await supabaseClient
                .from('orders')
                .delete()
                .eq('id', orderId);

            if (error) {
                alert("Error deleting order: " + error.message);
            } else {
                loadDispatchesFromSupabase();
            }
        }

        function updateStatus(isOnline, text) {
            document.getElementById('sync-dot').className = `w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-500' : 'bg-rose-500'}`;
            document.getElementById('sync-text').innerText = text;
        }

        function renderDispatches(orders) {
            const container = document.getElementById('dispatch-list');
            document.getElementById('order-count').innerText = `${orders.length} Orders`;
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-slate-500 bg-slate-950/50 border border-slate-800 rounded-xl space-y-2">
                        <i data-lucide="inbox" class="w-8 h-8 mx-auto stroke-1 text-slate-600"></i>
                        <p class="text-sm">No dispatches created yet. Use the form on the left to add one.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            orders.forEach((o) => {
                const vehicles = o.vehicles || [];
                const vehicleBadge = vehicles.map(v => `
                    <span class="inline-flex items-center gap-1.5 bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-lg border border-slate-700">
                        <i data-lucide="car" class="w-3.5 h-3.5 text-emerald-400"></i>
                        ${v.ymm} ${v.vin ? `<span class="text-[10px] font-mono text-emerald-400">(${v.vin})</span>` : ''}
                    </span>
                `).join(' ');

                const card = document.createElement('div');
                card.className = "bg-slate-950/60 border border-slate-800 rounded-xl p-4 space-y-3";
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-emerald-400 text-sm">${o.order_number}</span>
                            <span class="text-xs text-slate-400">| ${o.broker_name}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${o.order_status === 'Delivered' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-indigo-500/10 text-indigo-400 border border-indigo-500/20'}">
                                ${o.order_status}
                            </span>
                            <button onclick="deleteOrder('${o.id}')" class="text-slate-500 hover:text-rose-400 p-1 transition-colors">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-300 bg-slate-900/50 p-2.5 rounded-lg border border-slate-800/80">
                        <div><strong class="text-slate-500 text-[10px] uppercase block">Pickup:</strong> ${o.pickup}</div>
                        <div><strong class="text-slate-500 text-[10px] uppercase block">Dropoff:</strong> ${o.drop}</div>
                    </div>

                    <div class="flex flex-wrap gap-1.5 pt-1">
                        ${vehicleBadge}
                    </div>
                `;
                container.appendChild(card);
            });

            lucide.createIcons();
        }
    </script>
</body>
</html>
